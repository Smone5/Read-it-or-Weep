name: Backend & Frontend Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: quiz
          POSTGRES_PASSWORD: quiz_test_password
          POSTGRES_DB: quiz_game_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-asyncio httpx
      - name: Run backend unit, fuzz, concurrency, and Postgres integration tests
        env:
          APP_SECRET: ci-test-secret-do-not-use-in-production
          DATABASE_URL: postgresql://quiz:quiz_test_password@127.0.0.1:5432/quiz_game_test
          TEST_DATABASE_URL: postgresql://quiz:quiz_test_password@127.0.0.1:5432/quiz_game_test
        run: |
          pytest backend/tests --ignore=backend/tests/test_eleven.py -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install & build web app
        run: |
          npm --prefix web ci
          npm --prefix web run build
